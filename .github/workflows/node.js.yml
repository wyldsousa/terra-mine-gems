name: Deploy Terra Mine Gems

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install

      - name: Criar aplicativo
        run: npm run build

      - name: Ver arquivos gerados
        run: |
          echo "=== CONTEÚDO DA RAIZ ==="
          ls -la
          echo ""
          echo "=== PASTAS GERADAS ==="
          find . -maxdepth 4 -type d | sort
          echo ""
          echo "=== ARQUIVOS GERADOS ==="
          find . -maxdepth 4 -type f | sort | head -300

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Fazer upload do aplicativo
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
